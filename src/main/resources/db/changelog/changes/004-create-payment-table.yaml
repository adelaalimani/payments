databaseChangeLog:
  - changeSet:
      id: 004-create-payment-table
      author: adela
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payment
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
              - column:
                  name: status
                  type: VARCHAR(255)
              - column:
                  name: method
                  type: VARCHAR(255)
              - column:
                  name: reference
                  type: VARCHAR(255)
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_by
                  type: BIGINT
